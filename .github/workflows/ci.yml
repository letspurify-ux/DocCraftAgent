name: Verify
on: [push, pull_request]
jobs:
  platform:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: node --experimental-strip-types --test frontend/scripts/api-response.test.mjs
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: npm run build
        working-directory: frontend
      - run: cargo build --locked
      - run: node scripts/test-all.mjs
        timeout-minutes: 5
  integration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12.2
        env:
          MARIADB_ROOT_PASSWORD: ci-only-password
          MARIADB_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd='healthcheck.sh --connect --innodb_initialized'
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: cargo build --locked
      - run: cargo test --locked -- --ignored --test-threads=1
        env:
          DOCCRAFT_TEST_DB_PORT: '3306'
          DOCCRAFT_TEST_DB_PASSWORD: ci-only-password
      - run: python3 scripts/smoke.py
        env:
          DOCCRAFT_DB_PASSWORD: ci-only-password
          DOCCRAFT_UI_TEST: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-evidence
          path: |
            docs/smoke-results.json
            frontend/playwright-report
            frontend/test-results
